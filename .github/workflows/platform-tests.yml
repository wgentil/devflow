name: Platform tests
on:
  push:
    branches: [main, feat/windows-portability]
  pull_request:
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - if: runner.os == 'Windows'
        working-directory: tests
        run: python -m unittest test_native_models.NativeModelTests.test_rpc_send_obeys_deadline_when_host_stops_reading -v
      - if: runner.os == 'Windows'
        working-directory: tests
        run: python -m unittest test_native_models.NativeModelTests.test_transport_limits_output_and_timeout test_native_models.NativeModelTests.test_rpc_send_obeys_deadline_when_host_stops_reading -v
      - if: runner.os == 'Windows'
        working-directory: tests
        run: python -m unittest test_native_models.NativeModelTests.test_transport_stops_children_when_leader_exits test_native_models.NativeModelTests.test_rpc_send_obeys_deadline_when_host_stops_reading -v
      - if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -p test_native_models.py -f -v
      - run: python -m unittest discover -s tests -f -v
